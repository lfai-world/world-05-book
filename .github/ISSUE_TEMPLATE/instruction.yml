name: Instruction
description: The owner says what should happen; the agent files it here, word for word, then works it through a pull request.
title: "Instruction: "
labels: ["instruction"]
body:
  - type: textarea
    id: said
    attributes:
      label: What the owner said
      description: Spoken words, kept as they were (speech-to-text).
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that prove it — written by the agent before work starts.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [dashboard, playbook, qa, line]
